"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyonight"
add_newline = false
command_timeout = 800

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[palettes.tokyonight]
fg = "#c0caf5"
comment = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
magenta = "#bb9af7"
green = "#9ece6a"
orange = "#ff9e64"
red = "#f7768e"
yellow = "#e0af68"

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "magenta"
format = "[$symbol$branch]($style) "

[git_status]
style = "red"
format = '([$all_status$ahead_behind]($style) )'

[nodejs]
symbol = " "
style = "green"
format = "[$symbol$version]($style) "

[python]
symbol = " "
style = "yellow"
format = '[$symbol$version( \($virtualenv\))]($style) '

[golang]
symbol = " "
style = "cyan"
format = "[$symbol$version]($style) "

[rust]
symbol = " "
style = "orange"
format = "[$symbol$version]($style) "

[docker_context]
symbol = " "
style = "blue"
format = "[$symbol$context]($style) "

[cmd_duration]
min_time = 2000
style = "comment"
format = "[took $duration]($style) "

[character]
success_symbol = "[❯](bold magenta)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
