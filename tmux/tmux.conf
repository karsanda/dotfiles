# --- Prefix: Ctrl+a (easier to reach than Ctrl+b) ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal / Neovim friendliness ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -sg escape-time 10        # no lag on Esc in nvim
set -g focus-events on        # nvim autoread on focus
set -g set-clipboard on       # copy via OSC 52 to the system clipboard
set -g allow-passthrough on   # images / notifications from inner apps
set -g history-limit 50000
set -g mouse on

# --- Windows & panes ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S: #W"

# splits keep the current directory: prefix | and prefix -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# move between panes with prefix h/j/k/l, resize with prefix H/J/K/L
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# vi keys in copy mode (prefix [ ), v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# reload this file: prefix r
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# --- Theme: TokyoNight night (24-hour clock) ---
set -g clock-mode-style 24
source-file ~/.config/tmux/tokyonight_night.tmux
